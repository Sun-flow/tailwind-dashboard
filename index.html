<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Influencer dashboard — income, revenue, and engagement across platforms and products.">
  <title>Influencer Dashboard</title>

  <!-- Apply the saved theme before first paint (design-spec §9). Dark unless the user saved "light". -->
  <script>
    try {
      if (localStorage.getItem("theme") === "light") document.documentElement.classList.remove("dark");
    } catch (e) {}
  </script>

  <!-- Tailwind CSS v4 (CDN, no build step). `@custom-variant dark` keys `dark:` off the `.dark` class on <html>. -->
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>

  <!-- Charts.css — the only visualization library (design-spec §2, §7). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/charts.css@1.2.0/dist/charts.min.css">
</head>

<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 antialiased">

  <!-- Skip link (a11y) -->
  <a href="#main"
     class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50
            focus:bg-sky-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-lg
            focus:outline-2 focus:outline-offset-2 focus:outline-sky-500">
    Skip to content
  </a>

  <!-- Sticky inline anchor nav (design-spec §1, §5) -->
  <header class="sticky top-0 z-50 backdrop-blur bg-gray-50/90 dark:bg-slate-900/90 border-b border-gray-200 dark:border-slate-700">
    <div class="max-w-screen-xl mx-auto px-4 md:px-6 lg:px-8">
      <div class="flex items-center justify-between gap-2 h-16">
        <h1 class="flex items-center gap-2 text-base sm:text-lg font-bold tracking-tight">
          <span aria-hidden="true">📊</span>
          <a href="#main" class="rounded focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500">Influencer Dashboard</a>
        </h1>
        <div class="flex items-center gap-1">
          <nav aria-label="Dashboard sections">
            <ul class="flex items-center">
              <li><a href="#kpis" class="nav-link inline-flex items-center min-h-11 px-2 md:px-3 rounded-md text-sm font-medium text-gray-600 dark:text-slate-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500 transition-colors duration-200 motion-reduce:transition-none">KPIs</a></li>
              <li><a href="#drivers" class="nav-link inline-flex items-center min-h-11 px-2 md:px-3 rounded-md text-sm font-medium text-gray-600 dark:text-slate-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500 transition-colors duration-200 motion-reduce:transition-none">Drivers</a></li>
              <li><a href="#details" class="nav-link inline-flex items-center min-h-11 px-2 md:px-3 rounded-md text-sm font-medium text-gray-600 dark:text-slate-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500 transition-colors duration-200 motion-reduce:transition-none">Details</a></li>
              <li class="hidden md:list-item"><a href="#main" class="inline-flex items-center min-h-11 px-3 rounded-md text-sm font-medium text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500 transition-colors duration-200 motion-reduce:transition-none">↑ Top</a></li>
            </ul>
          </nav>
          <button id="theme-toggle" type="button" aria-pressed="true" aria-label="Dark mode"
                  class="inline-flex items-center justify-center gap-1.5 min-h-11 min-w-11 px-2 md:px-3 rounded-md border border-gray-200 dark:border-slate-700 text-sm font-medium text-gray-600 dark:text-slate-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500 transition-colors duration-200 motion-reduce:transition-none">
            <span aria-hidden="true">🌙</span>
            <span class="hidden md:inline">Dark mode</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="max-w-screen-xl mx-auto px-4 md:px-6 lg:px-8 py-8 space-y-8">

    <!-- TOP BLOCK: Outcome KPIs -->
    <section id="kpis" class="scroll-mt-20" aria-labelledby="kpis-heading">
      <h2 id="kpis-heading" class="text-xl font-semibold mb-4">Key Outcomes</h2>
      <div id="kpi-grid" class="grid gap-4 md:grid-cols-2 lg:grid-cols-4 lg:gap-6">
        <!-- kpiCard() × 4, rendered by app.js -->
      </div>
    </section>

    <!-- MIDDLE BLOCK: Drivers -->
    <section id="drivers" class="scroll-mt-20" aria-labelledby="drivers-heading">
      <h2 id="drivers-heading" class="text-xl font-semibold mb-4">Drivers</h2>
      <div id="driver-grid" class="grid gap-4 lg:grid-cols-2 lg:gap-6">
        <!-- barChart() cards, rendered by app.js -->
      </div>
    </section>

    <!-- BOTTOM BLOCK: Operational Details -->
    <section id="details" class="scroll-mt-20" aria-labelledby="details-heading">
      <h2 id="details-heading" class="text-xl font-semibold mb-4">Operational Details</h2>
      <div id="detail-grid" class="grid gap-4 lg:grid-cols-2 lg:gap-6">
        <!-- dataTable() cards (full width) and list cards, rendered by app.js -->
      </div>
    </section>

  </main>

  <footer class="border-t border-gray-200 dark:border-slate-700 py-6 text-center text-xs text-gray-500 dark:text-slate-400">
    <p>Generated mock data · schema v1.0 · period <span id="footer-period"></span></p>
  </footer>

  <!-- Single data source (API-ready): renderers consume this module only -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
